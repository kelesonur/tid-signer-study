<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>TİD Çeviri Değerlendirmesi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">TİD Çeviri Değerlendirmesi</div>
  <div class="progress-wrap" aria-live="polite">
    <div class="progress-label" id="progressLabel"></div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="save-status" id="saveStatus" title=""></div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <span id="pidLabel"></span>
  <a class="hidden" id="freeLink" href="serbest.html" target="_blank" rel="noopener">Serbest çeviri</a>
  <button class="link" id="langToggle" type="button">EN</button>
</footer>
<script>
  // researcher-only link to the free-translation page, shown in expert/moderator modes
  const _mode = new URLSearchParams(location.search).get("mode");
  if (_mode === "mod" || _mode === "expert") document.getElementById("freeLink").classList.remove("hidden");
</script>

<!-- Loaded as scripts (not JSON) so the page also works when opened
     directly from disk (file://) during in-person sessions.
     study_config.js: texts, questions, endpoint (edit by hand)
     stimuli.js:      items, pairs, practice (written by build_stimuli.py) -->
<script src="study_config.js"></script>
<script src="stimuli.js"></script>
<script src="app.js"></script>
</body>
</html>
